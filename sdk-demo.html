<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoneyPlayBox SDK Demo</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f3f6f8;
      color: #17212b;
    }

    main {
      display: grid;
      gap: 14px;
      max-width: 760px;
    }

    main > *, .stack > *, .device-item > * {
      min-width: 0;
    }

    input[type="file"] {
      max-width: 100%;
      box-sizing: border-box;
    }

    .file-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .file-picker button { flex-shrink: 0; }
    #funscriptFileName { min-width: 0; overflow-wrap: anywhere; }

    .device-name, .device-meta, .queue-meta, #funscriptStatus {
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      .device-item {
        grid-template-columns: auto 40px minmax(0, 1fr) !important;
      }
      .device-item .battery {
        grid-column: 2 / -1;
      }
      .device-item .device-status {
        grid-column: 3;
      }
    }

    button,
    input,
    textarea {
      min-height: 34px;
      border: 1px solid #bdc8d4;
      border-radius: 7px;
      padding: 0 10px;
      font: inherit;
    }

    button {
      background: #146b5c;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      background: #8fa29e;
      cursor: not-allowed;
    }

    section {
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: white;
      padding: 14px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    textarea {
      width: 100%;
      min-height: 128px;
      padding: 10px;
      box-sizing: border-box;
      font-family: Consolas, "SFMono-Regular", monospace;
      resize: vertical;
    }

    .device-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .device-item {
      display: grid;
      grid-template-columns: auto 40px 1fr minmax(110px, 150px) auto;
      gap: 10px;
      align-items: center;
      width: 100%;
      min-height: 64px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: #f8fbfc;
      color: #17212b;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;
    }

    .device-item.is-selected {
      border-color: #146b5c;
      box-shadow: 0 0 0 2px rgba(20, 107, 92, 0.16);
    }

    .device-avatar {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #e8eef2;
      object-fit: cover;
    }

    .device-name {
      font-weight: 700;
    }

    .device-id {
      color: #607181;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .device-meta {
      color: #3f5364;
      font-size: 12px;
    }

    .battery {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .battery-label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #3f5364;
      font-size: 12px;
      font-weight: 700;
    }

    .battery-track {
      height: 8px;
      border-radius: 999px;
      background: #dde6ec;
      overflow: hidden;
    }

    .battery-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #1f8a70;
      transition: width 180ms ease;
    }

    .battery.is-low .battery-fill {
      background: #c94f4f;
    }

    .battery.is-unknown .battery-fill {
      background: #a8b5bf;
    }

    .device-status {
      color: #146b5c;
      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      color: #607181;
      margin: 10px 0 0;
    }

    .queue-header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .queue-title {
      margin: 0;
      font-size: 16px;
    }

    .queue-meta {
      color: #3f5364;
      font-size: 12px;
      font-weight: 700;
    }

    .queue-list {
      display: grid;
      gap: 8px;
    }

    .queue-item {
      display: grid;
      gap: 6px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: #f8fbfc;
      padding: 10px;
    }

    .queue-item-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      color: #17212b;
      font-weight: 700;
    }

    .queue-command {
      color: #3f5364;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    pre {
      min-height: 180px;
      max-height: 360px;
      overflow: auto;
      border-radius: 8px;
      background: #101820;
      color: #d5f2e3;
      padding: 12px;
    }
  </style>
</head>

<body>
  <main>
    <h1>HoneyPlayBox SDK Demo</h1>

    <section>
      <div class="row">
        <label for="transport">Transport</label>
        <select id="transport"><option value="ble">BLE</option><option value="hid">HID</option></select>
        <button id="check">Check Support</button>
        <button id="discover">Discover</button>
        <button id="connectHid" hidden>Connect HID</button>
        <button id="disconnectHid" hidden>Disconnect HID</button>
        <button id="connect" disabled>Connect Selected</button>
        <button id="sendCommand">Send Command</button>
        <button id="stopCommand">Stop Command</button>
        <button id="readBattery">Read Battery</button>
        <button id="disconnect">Disconnect</button>
      </div>
      <div id="deviceList" class="device-list" aria-label="Discovered devices"></div>
      <p id="emptyDevices" class="empty">No devices discovered yet.</p>
      <p id="actionStatus" class="empty" aria-live="polite"></p>
    </section>

    <section>
      <div class="stack">
        <div class="row">
          <label>Value <input id="commandValue" type="number" min="0" max="100" value="50"></label>
          <label>Center <input id="centerPosition" type="number" min="0" max="100" value="40"></label>
          <label>Amplitude <input id="amplitude" type="number" min="0" max="80" value="40"></label>
          <label>Speed <input id="speed" type="number" min="0" max="10" value="10"></label>
          <label>Function <select id="toyFunction"></select></label>
          <label>Point <select id="stimulusPoint">
              <option value="">Auto</option>
              <option value="c">C</option>
              <option value="g">G</option>
              <option value="a">A</option>
              <option value="u">U</option>
              <option value="o">O</option>
              <option value="p">P</option>
            </select></label>
          <label>Mode <select id="commandMode">
              <option value="immediate">Immediate</option>
              <option value="funscript">Funscript</option>
              <option value="queue">Queue</option>
            </select></label>
          <label>Duration(ms) <input id="duration" type="number" min="0" step="100" value="2000"></label>
          <button id="fillCommands" type="button">Use Form Values</button>
        </div>
        <label class="stack">
          Command array
          <textarea id="commands" spellcheck="false"></textarea>
        </label>
      </div>
    </section>

    <section>
      <div class="stack">
        <div class="queue-header">
          <h2 class="queue-title">Connector Queue</h2>
          <span id="queueMeta" class="queue-meta">No selected toy</span>
        </div>
        <div id="queueList" class="queue-list" aria-label="Command queue"></div>
        <p id="emptyQueue" class="empty">No waiting commands.</p>
      </div>
    </section>

    <section id="funscriptPanel" hidden>
      <div class="stack">
        <h2 class="queue-title">Funscript</h2>
        <div class="file-picker">
          <button id="chooseFunscriptFile" type="button">Choose File</button>
          <span id="funscriptFileName" aria-live="polite">No file chosen</span>
          <input id="funscriptFile" type="file" accept=".funscript,.json,application/json" aria-label="Funscript file" hidden>
        </div>
        <label class="stack">Script<textarea id="funscriptInput" spellcheck="false">{"actions":[{"at":0,"pos":0},{"at":1000,"pos":80},{"at":2000,"pos":0}]}</textarea></label>
        <div class="row">
          <button id="loadFunscript" type="button">Load</button>
          <button id="startFunscript" type="button">Start</button>
          <button id="resumeFunscript" type="button">Resume</button>
          <button id="pauseFunscript" type="button">Pause</button>
          <button id="stopFunscript" type="button">Stop</button>
          <button id="restartFunscript" type="button">Restart</button>
        </div>
        <div class="row">
          <label>Time (ms) <input id="funscriptTime" type="number" min="0" step="100" value="0"></label>
          <button id="seekFunscript" type="button">Seek</button>
          <button id="calibrateFunscriptTime" type="button">Calibrate</button>
          <button id="jumpFunscriptBack" type="button">-5 s</button>
          <button id="jumpFunscriptForward" type="button">+5 s</button>
          <label>Speed <select id="funscriptRate"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="4">4x</option></select></label>
        </div>
        <progress id="funscriptProgress" max="1" value="0" style="width:100%"></progress>
        <output id="funscriptStatus" aria-live="polite">No script loaded.</output>
      </div>
    </section>
    <pre id="log"></pre>
  </main>
  <script>
    // Keep the published SDK as the default; opt in to local integration testing.
    const localSdk = new URLSearchParams(location.search).get("sdk") === "local";
    document.write('<script src="' + (localSdk ? '/honeyplaybox-connector-jssdk.js?catalog=local' : '//sdk.honeyplaybox.com/prod/native-sdk/jssdk/honeyplaybox-opensdk-jssdk.min.js') + '"><\/script>');
  </script>
  <script>

    const connectorOptions = localSdk ? { protocolWasmUrl: "/protocol.wasm" } : {};
    const bleConnector = new HoneyPlayBox.OpenSDK.ToyConnector(connectorOptions);
    const hidConnector = HoneyPlayBox.OpenSDK.HIDToyConnector ? new HoneyPlayBox.OpenSDK.HIDToyConnector(connectorOptions) : null;
    let connector = bleConnector;
    // Keep UI subscriptions stable while selecting a different connector instance.
    for (const type of ["feedback", "queuechange", "connect", "disconnect", "error", "discover", "funscriptstate"]) {
      hidConnector?.addEventListener(type, (event) => {
        if (connector === hidConnector) bleConnector.dispatchEvent(new CustomEvent(type, { detail: event.detail }));
      });
    }
    const log = document.querySelector("#log");
    const deviceList = document.querySelector("#deviceList");
    const emptyDevices = document.querySelector("#emptyDevices");
    const actionStatus = document.querySelector("#actionStatus");
    const queueMeta = document.querySelector("#queueMeta");
    const queueList = document.querySelector("#queueList");
    const emptyQueue = document.querySelector("#emptyQueue");
    const connectButton = document.querySelector("#connect");
    const commandsInput = document.querySelector("#commands");
    const functionSelect = document.querySelector("#toyFunction");
    const stimulusPointSelect = document.querySelector("#stimulusPoint");
    const commandModeSelect = document.querySelector("#commandMode");
    const commandValueInput = document.querySelector("#commandValue");
    const centerPositionInput = document.querySelector("#centerPosition");
    const amplitudeInput = document.querySelector("#amplitude");
    const speedInput = document.querySelector("#speed");
    const durationInput = document.querySelector("#duration");
    const discoveredDevices = new Map();
    const deviceStates = new Map();
    let selectedToyId = "";

    function write(message, value) {
      const body = value ? `\n${JSON.stringify(value, null, 2)}` : "";
      log.textContent = `${new Date().toLocaleTimeString()} ${message}${body}\n\n${log.textContent}`;
    }

    function setStatus(message = "") {
      actionStatus.textContent = message;
    }

    function getDeviceStatus(toyId) {
      const cachedState = deviceStates.get(toyId);
      if (cachedState) {
        return cachedState;
      }
      const connectedToy = connector.getToy(toyId);
      if (connectedToy?.connected) {
        return "Connected";
      }
      return selectedToyId === toyId ? "Selected" : "";
    }

    function setDeviceStatus(toyId, status) {
      if (!toyId) {
        return;
      }
      if (status) {
        deviceStates.set(toyId, status);
      } else {
        deviceStates.delete(toyId);
      }
      renderDeviceList();
      renderCommandQueue();
    }

    function formatConnectionStatus(detail = {}) {
      if (detail.manual) {
        return "Disconnected";
      }
      switch (detail.status) {
        case "connected":
        case "reconnected":
          return "Connected";
        case "reconnecting":
          return `Reconnecting ${detail.attempt || ""}`.trim();
        case "reconnectError":
          return "Reconnect failed";
        case "reconnectStopped":
          return "Disconnected";
        default:
          return detail.autoReconnect ? "Reconnecting" : "Disconnected";
      }
    }

    function getBatteryLevel(toyId) {
      const connectedToy = connector.getToy(toyId);
      const liveLevel = connectedToy?.batteryLevel;
      if (Number.isFinite(liveLevel)) {
        return Math.max(0, Math.min(100, Math.round(liveLevel)));
      }
      const cachedLevel = discoveredDevices.get(toyId)?.batteryLevel;
      return Number.isFinite(cachedLevel) ? Math.max(0, Math.min(100, Math.round(cachedLevel))) : null;
    }

    function updateDeviceBattery(toyId, batteryLevel) {
      if (!toyId || !Number.isFinite(Number(batteryLevel))) {
        return;
      }
      const device = discoveredDevices.get(toyId);
      if (device) {
        discoveredDevices.set(toyId, {
          ...device,
          batteryLevel: Math.max(0, Math.min(100, Math.round(Number(batteryLevel))))
        });
      }
      renderDeviceList();
    }

    function updateConnectState() {
      connectButton.disabled = !selectedToyId;
    }

    function getSelectedToySummary() {
      const connectedToy = selectedToyId ? connector.getToy(selectedToyId) : null;
      return connectedToy?.toJSON?.() || discoveredDevices.get(selectedToyId) || null;
    }

    function getAvailableToyFunctions() {
      const toy = getSelectedToySummary();
      const features = Array.isArray(toy?.features) ? toy.features : [];
      return features.length ? features : [
        HoneyPlayBox.OpenSDK.ToyFunctions.Vibrate,
        HoneyPlayBox.OpenSDK.ToyFunctions.Constrict
      ];
    }

    function renderFunctionOptions() {
      const previous = functionSelect.value;
      const features = getAvailableToyFunctions();
      functionSelect.replaceChildren(...features.map((feature) => {
        const option = document.createElement("option");
        option.value = feature;
        option.textContent = feature;
        return option;
      }));
      functionSelect.value = features.includes(previous) ? previous : features[0];
    }

    function renderCommandMode() {
      const connectedToy = selectedToyId ? connector.getToy(selectedToyId) : null;
      commandModeSelect.value = connectedToy?.commandMode === "normal" ? "immediate" : connectedToy?.commandMode || "immediate";
      document.querySelector("#funscriptPanel").hidden = commandModeSelect.value !== "funscript";
      renderFunscriptState(connectedToy?.getFunscriptState?.());
    }

    function applySelectedCommandMode() {
      const connectedToy = selectedToyId ? connector.getToy(selectedToyId) : null;
      if (connectedToy) {
        connector.setCommandMode(connectedToy.toyId, commandModeSelect.value);
      }
    }

    function getFormCommand() {
      const command = {
        toyId: selectedToyId || undefined,
        duration: Number(durationInput.value),
        function: functionSelect.value || HoneyPlayBox.OpenSDK.ToyFunctions.Vibrate
      };
      if (command.function === HoneyPlayBox.OpenSDK.ToyFunctions.Position) {
        command.centerPosition = Number(centerPositionInput.value);
        command.amplitude = Number(amplitudeInput.value);
        command.speed = Number(speedInput.value);
      } else {
        command.value = Number(commandValueInput.value);
      }
      if (stimulusPointSelect.value) {
        command.target = stimulusPointSelect.value;
      }
      return command;
    }

    function setCommandArrayFromForm() {
      commandsInput.value = JSON.stringify([getFormCommand()], null, 2);
    }

    function formatCommandSummary(command) {
      const parts = [
        `Function: ${command.function || "Unknown"}`,
        `Duration: ${command.duration ?? 0}ms`
      ];
      if (command.target) {
        parts.push(`Point: ${String(command.target).toUpperCase()}`);
      }
      if (command.value !== undefined) {
        parts.push(`Value: ${command.value}`);
      }
      if (command.centerPosition !== undefined) {
        parts.push(`Center: ${command.centerPosition}`);
      }
      if (command.amplitude !== undefined) {
        parts.push(`Amplitude: ${command.amplitude}`);
      }
      if (command.speed !== undefined) {
        parts.push(`Speed: ${command.speed}`);
      }
      return parts.join(" | ");
    }

    function renderCommandQueue() {
      const queue = connector.Queue.getItems();
      queueMeta.textContent = `Running: ${queue.filter((entry) => entry.status === "running").length} | Waiting: ${queue.filter((entry) => entry.status === "waiting").length}`;
      emptyQueue.hidden = queue.length > 0;
      queueList.replaceChildren(...queue.map((entry) => {
        const item = document.createElement("div");
        item.className = "queue-item";

        const head = document.createElement("div");
        head.className = "queue-item-head";
        const title = document.createElement("span");
        title.textContent = `#${entry.position} ${entry.name} | ${entry.commandId}`;
        const status = document.createElement("span");
        status.textContent = entry.status;
        head.append(title, status);

        const commandRows = entry.commands.map((command) => {
          const row = document.createElement("div");
          row.className = "queue-command";
          row.textContent = formatCommandSummary(command);
          return row;
        });

        item.append(head, ...commandRows);
        return item;
      }));
    }

    function parseCommandArray() {
      const commands = JSON.parse(commandsInput.value || "[]");
      if (!Array.isArray(commands)) {
        throw new Error("Commands must be a JSON array.");
      }
      if (commands.length === 0) {
        throw new Error("Add at least one command.");
      }
      return commands.map((command) => ({
        ...command,
        toyId: command.toyId || selectedToyId || undefined
      }));
    }

    function renderDeviceList() {
      const devices = Array.from(discoveredDevices.values());
      emptyDevices.hidden = devices.length > 0;
      deviceList.replaceChildren(...devices.map((device) => {
        const item = document.createElement("label");
        item.className = "device-item";
        item.classList.toggle("is-selected", device.toyId === selectedToyId);

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "device";
        radio.checked = device.toyId === selectedToyId;

        const avatar = document.createElement("img");
        avatar.className = "device-avatar";
        avatar.alt = "";
        avatar.src = device.avatar || "https://sdk.honeyplaybox.com/prod/product/logo/default.png";

        const text = document.createElement("div");
        const name = document.createElement("div");
        name.className = "device-name";
        name.textContent = device.name;
        const id = document.createElement("div");
        id.className = "device-id";
        id.textContent = `Toy ID: ${device.toyId}`;
        const meta = document.createElement("div");
        meta.className = "device-meta";
        meta.textContent = `Features: ${device.features.map(formatToyFeature).join(", ") || "None"}`;
        text.append(name, id, meta);

        const batteryLevel = getBatteryLevel(device.toyId);
        const battery = document.createElement("div");
        battery.className = "battery";
        battery.classList.toggle("is-low", batteryLevel !== null && batteryLevel <= 20);
        battery.classList.toggle("is-unknown", batteryLevel === null);
        const batteryLabel = document.createElement("div");
        batteryLabel.className = "battery-label";
        const batteryText = document.createElement("span");
        batteryText.textContent = "Battery";
        const batteryValue = document.createElement("span");
        batteryValue.textContent = batteryLevel === null ? "--" : `${batteryLevel}%`;
        batteryLabel.append(batteryText, batteryValue);
        const batteryTrack = document.createElement("div");
        batteryTrack.className = "battery-track";
        const batteryFill = document.createElement("div");
        batteryFill.className = "battery-fill";
        batteryFill.style.width = `${batteryLevel ?? 0}%`;
        batteryTrack.append(batteryFill);
        battery.append(batteryLabel, batteryTrack);

        const status = document.createElement("div");
        status.className = "device-status";
        status.textContent = getDeviceStatus(device.toyId);

        item.append(radio, avatar, text, battery, status);
        item.addEventListener("change", () => {
          selectedToyId = device.toyId;
          updateConnectState();
          renderFunctionOptions();
          renderCommandMode();
          renderDeviceList();
          renderCommandQueue();
        });
        return item;
      }));
      updateConnectState();
      renderCommandQueue();
    }

    async function runAction(label, action) {
      try {
        setStatus("");
        return await action();
      } catch (error) {
        setStatus(`${label} failed: ${error?.message || String(error)}`);
        return null;
      }
    }

    function getFeedbackMessage(feedback) {
      if (feedback.kind === "battery") {
        return "battery feedback";
      }
      if (feedback.kind === "pressure") {
        return "pressure feedback";
      }
      if (feedback.value !== null && feedback.value !== undefined) {
        return `${feedback.kind} feedback`;
      }
      return "feedback";
    }

    function formatToyFeature(feature) {
      const match = Object.entries(HoneyPlayBox.OpenSDK.ToyFunctions)
        .find(([, value]) => value === feature);
      return match ? `ToyFunctions.${match[0]}` : "ToyFunctions.unknown";
    }

    connector.onFeedback((feedback) => {
      if (feedback.kind === "battery") {
        updateDeviceBattery(feedback.toyId, feedback.value);
      }
      write(getFeedbackMessage(feedback), {
        toyId: feedback.toyId,
        name: feedback.name,
        kind: feedback.kind,
        value: feedback.value,
        unit: feedback.unit,
        time: feedback.time
      });
    });

    const handleQueueChange = (queueState) => {
      renderCommandQueue();
      write("queue change", {
        scope: queueState.scope,
        toyId: queueState.toyId,
        name: queueState.name,
        action: queueState.action,
        commandId: queueState.commandId,
        commandMode: queueState.commandMode,
        queuedCommandCount: queueState.queuedCommandCount,
        queue: queueState.queue,
        time: queueState.time
      });
    };
    if (typeof connector.onQueueChange === "function") {
      connector.onQueueChange(handleQueueChange);
    } else {
      connector.addEventListener("queuechange", (event) => handleQueueChange(event.detail));
    }

    connector.addEventListener("connect", (event) => {
      setDeviceStatus(event.detail.toyId, formatConnectionStatus(event.detail));
      renderDeviceList();
    });

    connector.addEventListener("disconnect", (event) => {
      setDeviceStatus(event.detail.toyId, formatConnectionStatus(event.detail));
      renderDeviceList();
      renderCommandQueue();
    });

    connector.addEventListener("error", (event) => setStatus(event.detail.message));
    connector.addEventListener("discover", (event) => {
      discoveredDevices.set(event.detail.toyId, event.detail);
      renderDeviceList();
    });

    let transportBusy = false;
    const hidButton = document.querySelector("#connectHid");
    const disconnectHidButton = document.querySelector("#disconnectHid");
    let hidCleanupPromise = null;

    function disconnectHidSafely() {
      if (hidCleanupPromise) return hidCleanupPromise;
      if (!hidConnector?.isHidConnected?.()) return Promise.resolve();
      const gateway = hidConnector.hidGateway;
      const toys = hidConnector.getConnectedToys();
      // Cancel both queue owners and playback synchronously before awaiting I/O.
      hidConnector.Queue.clear();
      for (const toy of toys) {
        toy.funscript.interrupt("disconnect");
        toy.clearCommandQueue();
        toy.clearCommandStopTimer();
      }
      transportBusy = true;
      renderTransportControls();
      hidCleanupPromise = (async () => {
        const failures = [];
        try {
          const stopped = await Promise.allSettled(toys.map(toy => hidConnector.Immediate.stop(toy.toyId)));
          failures.push(...stopped.filter(result => result.status === "rejected").map(result => result.reason));
          // Attempt every disconnect even if one toy rejects its stop command.
          const disconnected = await Promise.allSettled(toys.map(toy => hidConnector.disconnect(toy.toyId)));
          failures.push(...disconnected.filter(result => result.status === "rejected").map(result => result.reason));
        } finally {
          try { await gateway.close(); }
          finally {
            if (hidConnector.hidGateway === gateway) hidConnector.hidGateway = null;
            transportBusy = false;
            renderTransportControls();
          }
        }
        if (failures.length) throw new AggregateError(failures, "HID disconnected, but some toy stop or disconnect commands failed.");
      })().finally(() => { hidCleanupPromise = null; });
      return hidCleanupPromise;
    }

    function handleHidPageExit() {
      // Browsers do not await lifecycle promises. This is best effort, not a
      // hardware stop guarantee; explicit Disconnect HID can await completion.
      void disconnectHidSafely().catch(error => setStatus(error.message));
    }
    window.addEventListener("pagehide", handleHidPageExit);
    disconnectHidButton.addEventListener("click", async () => {
      await runAction("disconnect HID", async () => {
        await disconnectHidSafely();
        setStatus("HID toys stopped and adapter disconnected.");
      });
    });
    function renderTransportControls() {
      const isHid = connector.transport === "hid";
      const ready = Boolean(connector.isHidConnected?.());
      hidButton.hidden = !isHid;
      hidButton.textContent = ready ? "HID Connected" : "Connect HID";
      hidButton.disabled = transportBusy || ready;
      disconnectHidButton.hidden = !isHid;
      disconnectHidButton.disabled = transportBusy || !ready;
      // Register the early exit attempt only while an adapter is open.
      if (hidConnector?.isHidConnected?.()) window.addEventListener("beforeunload", handleHidPageExit);
      else window.removeEventListener("beforeunload", handleHidPageExit);
      document.querySelector("#transport").disabled = transportBusy;
      document.querySelector("#discover").disabled = transportBusy || (isHid && !ready);
    }

    hidButton.addEventListener("click", async () => {
      transportBusy = true;
      renderTransportControls();
      try {
        await runAction("connect HID", async () => {
          if (!connector.connectHid) throw new Error("Update the SDK to connect a HID adapter separately.");
          setStatus("Select a HID adapter...");
          await connector.connectHid();
          setStatus("HID adapter connected.");
        });
      } finally {
        transportBusy = false;
        renderTransportControls();
      }
    });
    navigator.hid?.addEventListener("disconnect", (event) => {
      // Gateway listeners may run after this listener; update once they finish.
      if (connector.transport !== "hid" || event.device !== connector.hidGateway?.device) return;
      queueMicrotask(() => {
        renderTransportControls();
        setStatus("HID adapter disconnected.");
      });
    });
    renderTransportControls();

    document.querySelector("#transport").addEventListener("change", async (event) => {
      const select = event.target;
      const discover = document.querySelector("#discover");
      transportBusy = true;
      renderTransportControls();
      try {
        const next = select.value === "hid" ? hidConnector : bleConnector;
        if (!next) throw new Error("Update the SDK to use HIDToyConnector.");
        if (connector === hidConnector) await disconnectHidSafely();
        for (const toy of connector.getConnectedToys()) await connector.disconnect(toy.toyId);
        await connector.hidGateway?.close();
        connector.hidGateway = null;
        connector = next;
        connector.discoveredDevices.clear();
        discoveredDevices.clear();
        deviceStates.clear();
        selectedToyId = "";
        renderDeviceList();
        renderCommandQueue();
        renderFunctionOptions();
        setStatus(`${select.value.toUpperCase()} selected.`);
      } catch (error) {
        select.value = connector.transport || "ble";
        setStatus(error.message);
      } finally { transportBusy = false; renderTransportControls(); }
    });

    document.querySelector("#check").addEventListener("click", async () => {
      await runAction("check", async () => {
        const state = connector.transport === "hid" ? await connector.isHidSupported() : await HoneyPlayBox.OpenSDK.isBleSupported();
        setStatus(state.available ? "Transport available." : "Transport unavailable. Use a supported browser on HTTPS or localhost.");
      });
    });

    document.querySelector("#discover").addEventListener("click", async () => {
      transportBusy = true;
      renderTransportControls();
      await runAction("discover", async () => {
        if (connector.transport === "hid" && !connector.isHidConnected?.()) throw new Error("Connect a HID adapter first.");
        setStatus(connector.transport === "hid" ? "Discovering toys..." : "Requesting device permission...");
        const devices = await connector.scan();
        for (const device of devices) {
          discoveredDevices.set(device.toyId, device);
          deviceStates.set(device.toyId, "Discovered");
          selectedToyId = device.toyId;
        }
        renderFunctionOptions();
        renderCommandMode();
        renderDeviceList();
        setStatus(devices.length ? `Discovered ${devices.length} device(s).` : "No configured devices discovered.");
      });
      transportBusy = false;
      renderTransportControls();
    });

    document.querySelector("#connect").addEventListener("click", async () => {
      await runAction("connect", async () => {
        if (!selectedToyId) {
          throw new Error("Select a device first.");
        }
        connectButton.disabled = true;
        const connectedToy = await connector.connect(selectedToyId);
        selectedToyId = connectedToy.toyId;
        setDeviceStatus(selectedToyId, "Connected");
        applySelectedCommandMode();
        updateDeviceBattery(selectedToyId, connectedToy.batteryLevel);
        renderFunctionOptions();
        renderCommandMode();
        setCommandArrayFromForm();
        renderDeviceList();
        renderCommandQueue();
      });
      updateConnectState();
    });

    document.querySelector("#fillCommands").addEventListener("click", () => {
      setCommandArrayFromForm();
    });

    functionSelect.addEventListener("change", () => {
      setCommandArrayFromForm();
    });

    [commandValueInput, centerPositionInput, amplitudeInput, speedInput, durationInput, stimulusPointSelect].forEach((control) => {
      control.addEventListener("change", setCommandArrayFromForm);
      control.addEventListener("input", setCommandArrayFromForm);
    });

    commandModeSelect.addEventListener("change", () => {
      applySelectedCommandMode();
      document.querySelector("#funscriptPanel").hidden = commandModeSelect.value !== "funscript";
      renderCommandQueue();
    });

    function renderFunscriptState(state) {
      document.querySelector("#funscriptProgress").value = state?.progress || 0;
      document.querySelector("#funscriptStatus").textContent = state
        ? `${state.state} | ${Math.round(state.positionMs)} / ${state.durationMs} ms | ${state.playbackRate}x${state.message ? ` | ${state.message}` : ""}`
        : "No script loaded.";
      if (state) document.querySelector("#funscriptRate").value = String(state.playbackRate);
    }
    connector.onFunscriptState?.((state) => {
      if (state.toyId === selectedToyId) renderFunscriptState(state);
    });
    // Native file-input captions follow the browser locale, not the page language.
    document.querySelector("#chooseFunscriptFile").addEventListener("click", () => {
      document.querySelector("#funscriptFile").click();
    });
    document.querySelector("#funscriptFile").addEventListener("change", async (event) => {
      document.querySelector("#funscriptFileName").textContent = event.target.files[0]?.name || "No file chosen";
      await runAction("read script", async () => {
        const file = event.target.files[0];
        if (file) document.querySelector("#funscriptInput").value = await file.text();
      });
    });
    for (const method of ["loadFunscript", "startFunscript", "resumeFunscript", "pauseFunscript", "stopFunscript", "restartFunscript", "seekFunscript", "calibrateFunscriptTime", "jumpFunscriptBack", "jumpFunscriptForward"]) {
      document.getElementById(method).addEventListener("click", async () => {
        await runAction(method, async () => {
          const toy = connector.getToy(selectedToyId);
          if (!toy?.connected) throw new Error("Select and connect a device first.");
          if (typeof toy.loadFunscript !== "function") throw new Error("Update the SDK to use funscript playback.");
          let state;
          if (method === "loadFunscript") {
            await connector.Funscript.load(selectedToyId, document.querySelector("#funscriptInput").value, {
              function: functionSelect.value,
              ...(stimulusPointSelect.value ? { target: stimulusPointSelect.value } : {})
            });
            state = connector.Funscript.getStatus(selectedToyId);
          } else if (method === "seekFunscript" || method === "calibrateFunscriptTime") state = await connector.Funscript[method === "seekFunscript" ? "seek" : "synchronizeTime"](selectedToyId, Number(document.querySelector("#funscriptTime").value));
          else if (method.startsWith("jump")) state = await connector.Funscript.jump(selectedToyId, method.endsWith("Back") ? -5000 : 5000);
          else state = await connector.Funscript[method.replace("Funscript", "")](selectedToyId);
          renderFunscriptState(state);
        });
      });
    }
    document.querySelector("#funscriptRate").addEventListener("change", async (event) => {
      await runAction("playback rate", async () => {
        const toy = connector.getToy(selectedToyId);
        if (!toy) throw new Error("Select and connect a device first.");
        renderFunscriptState(await connector.Funscript.setPlaybackRate(selectedToyId, Number(event.target.value)));
      });
    });

    document.querySelector("#sendCommand").addEventListener("click", async () => {
      await runAction("send command", async () => {
        const targetToy = selectedToyId ? connector.getToy(selectedToyId) : null;
        if (!targetToy) {
          throw new Error("Select and connect a device first.");
        }
        const commands = parseCommandArray();
        write("command input", {
          toyId: targetToy.toyId,
          name: targetToy.name,
          commands,
          time: Date.now()
        });
        if (commandModeSelect.value === "funscript") throw new Error("Use the Funscript playback controls.");
        await connector[commandModeSelect.value === "queue" ? "Queue" : "Immediate"].execute(selectedToyId, commands);
        renderCommandQueue();
      });
    });

    document.querySelector("#stopCommand").addEventListener("click", async () => {
      await runAction("stop command", async () => {
        const targetToy = selectedToyId ? connector.getToy(selectedToyId) : null;
        if (!targetToy) {
          throw new Error("Select and connect a device first.");
        }
        if (commandModeSelect.value === "funscript") await connector.Funscript.stop(selectedToyId);
        else await connector.Immediate.stop(selectedToyId);
        renderCommandQueue();
      });
    });

    document.querySelector("#readBattery").addEventListener("click", async () => {
      await runAction("read battery", async () => {
        const targetToy = selectedToyId ? connector.getToy(selectedToyId) : null;
        if (!targetToy) {
          throw new Error("Select and connect a device first.");
        }
        const batteryLevel = await connector.readBattery(selectedToyId);
        updateDeviceBattery(targetToy.id, batteryLevel);
        write("battery read", {
          toyId: targetToy.id,
          name: targetToy.name,
          kind: "battery",
          value: batteryLevel,
          unit: batteryLevel === null ? null : "percent",
          time: Date.now()
        });
      });
    });

    document.querySelector("#disconnect").addEventListener("click", async () => {
      await runAction("disconnect", async () => {
        const targetToy = selectedToyId ? connector.getToy(selectedToyId) : null;
        if (targetToy) await connector.disconnect(selectedToyId);
        renderDeviceList();
        renderCommandQueue();
      });
    });

    renderFunctionOptions();
    renderCommandMode();
    renderDeviceList();
    renderCommandQueue();
    setCommandArrayFromForm();
  </script>
</body>

</html>
